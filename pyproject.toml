[project]
name = "legalmt"
version = "0.1.0"
description = "VLSP 2026 Document-Level Legal Machine Translation with Limited-Parameter Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyyaml>=6.0",
    "sacrebleu>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]
gpu = [
    "vllm==0.30.0",
    "torch==2.13.0",
    "transformers>=5.10.4,<6",
    "peft>=0.21",
    "trl>=1.13",
    "accelerate>=1.15",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0",
    "huggingface_hub[hf-xet]>=1.31,<2",
    "sentence-transformers>=6.1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
