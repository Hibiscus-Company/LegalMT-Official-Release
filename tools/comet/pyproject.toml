[project]
name = "legalmt-comet"
version = "0.1.0"
description = "COMET segment scoring for LegalMT, isolated from the transformers 5 GPU env"
requires-python = ">=3.12,<3.13"
dependencies = [
    "unbabel-comet==2.2.7",
    "torch==2.13.0",
]

[tool.uv]
package = false
constraint-dependencies = [
    "cuda-bindings==13.4.3",
    "cuda-toolkit==13.0.3.0",
    "nvidia-cublas==13.1.1.3",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cudnn-cu13==9.20.0.48",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-cusparselt-cu13==0.8.1",
    "nvidia-nccl-cu13==2.29.7",
    "nvidia-nvjitlink==13.4.92",
    "nvidia-nvshmem-cu13==3.4.5",
    "triton==3.7.1",
    "setuptools<81",
]

[tool.legalmt-comet]
env_dir = ".venv-comet"
model = "Unbabel/wmt22-comet-da"
model_revision = "2760a223ac957f30acfb18c8aa649b01cf1d75f2"
encoder_hparam = "xlm-roberta-large"
encoder = "FacebookAI/xlm-roberta-large"
encoder_revision = "c23d21b0620b635a76227c604d44e43a9f0ee389"
encoder_files = ["config.json", "tokenizer.json", "tokenizer_config.json", "sentencepiece.bpe.model"]
