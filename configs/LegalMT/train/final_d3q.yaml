extends: _base_hymt_lora.yaml
run_tag: final_d3q_r128_2pass_hymt2

model:
  family: hymt
  repo_id: tencent/Hy-MT2-1.8B
  revision: 9a341cd1b679d3efd23b46e847b01745a71ed792
  local_path: null
  dtype: bfloat16
  attn_implementation: sdpa

data:
  sft: sft_v1_mtetQ_final
  token_budget: 130500000
  max_seq_len: 4096
  order_seed: 1

lora:
  r: 128
  alpha: 256
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  use_rslora: false

training:
  seed: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine_with_min_lr
  min_lr_rate: 0.1
  warmup_ratio: 0.1
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  bf16: true
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  loss_type: chunked_nll
  plain_layers: 8
  loraplus_lr_ratio: 4
  save_steps: 250
